name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No line-ending diffs after checkout
        run: git diff --exit-code
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: E2e (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb copyq
          xvfb-run -a bash -c 'copyq --start-server >/dev/null 2>&1 & until copyq eval true >/dev/null 2>&1; do sleep 0.2; done; pnpm test:e2e'
      - name: E2e (macOS, Windows)
        if: runner.os != 'Linux'
        run: pnpm test:e2e
